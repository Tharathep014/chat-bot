# Render Blueprint: deploys the schedule chatbot as one Node web service.
# The Express server serves both the built React client and /api.
services:
  - type: web
    name: schedule-chatbot
    runtime: node
    plan: free
    buildCommand: npm run setup && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render supplies PORT; the server must listen on all interfaces.
      - key: HOST
        value: 0.0.0.0
